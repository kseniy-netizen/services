<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/logo.jpg" type="image/x-icon">
    <link rel="shortcut icon" href="/logo.jpg" type="image/x-icon">
    <title>Capture Studio</title>
    <meta name="description" content="Профессиональный продакшн студио Capture Studio. Фотосъёмка, видеопродакшн, постобработка для вашего бизнеса.">
    <!-- ОТКЛЮЧЕНИЕ MIME-SNIFFING: Запрещает браузеру "угадывать" тип файлов -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <!-- ПОЛИТИКА REFERRER: Контролирует, какую информацию о странице передают при переходе по ссылкам -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!-- ЗАЩИТА ОТ XSS (для старых браузеров, уже есть у вас, но для полноты) -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <!-- ОГРАНИЧЕНИЕ ДОСТУПА К API БРАУЗЕРА (Важно для конфиденциальности) -->
    <meta name="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()">

    <!-- Безопасная CSP для разработки Vue -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';
                       script-src 'self' 'unsafe-inline' 'unsafe-eval';
                       style-src 'self' 'unsafe-inline';
                       img-src 'self' data: https:;
                       font-src 'self' data:;
                       connect-src 'self';
                       object-src 'none';
                       base-uri 'self';">
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    
</body>

</html>
